<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduCraft AI - Mode Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #F5F5F7;
      color: #0F0F11;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .offline-card {
      background: #FFFFFF;
      border: 2px solid #0F0F11;
      box-shadow: 4px 4px 0px #0F0F11;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #FACC15;
      color: #0F0F11;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 4px 8px;
      border: 1.5px solid #0F0F11;
      margin-bottom: 16px;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: #FEE2E2;
      border: 2px solid #0F0F11;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 12px;
      color: #4B5563;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0F0F11;
      color: #FFFFFF;
      border: 2px solid #0F0F11;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.25);
      padding: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge">MODE OFFLINE</div>
    <div class="icon-wrapper">📡</div>
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi EduCraft AI belum mendeteksi sinyal internet. Beberapa data lokal tetap tersimpan di perangkat Anda.</p>
    <button class="btn" onclick="window.location.reload()">Coba Hubungkan Ulang</button>
  </div>
</body>
</html>
